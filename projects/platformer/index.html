<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platformer (demo build)</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; background: #14171c;
                 color: #e8e6e1; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 12px; min-height: 100vh; }
    canvas { background: #1d232c; border: 2px solid #3c4653; border-radius: 6px;
             max-width: 96vw; height: auto; outline-offset: 3px; }
    canvas:focus-visible { outline: 3px solid #e0b34a; }
    .hint { margin: 0; font-size: 14px; color: #9aa5b1; }
    .hint kbd { background: #2a323d; border-radius: 4px; padding: 1px 6px; }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540" tabindex="0" role="img"
          aria-label="2D platformer. Use arrow keys or WASD to move, space to jump, enter to start."></canvas>
  <p class="hint">move <kbd>arrows</kbd>/<kbd>AD</kbd> · jump <kbd>space</kbd>/<kbd>W</kbd> · start/restart <kbd>enter</kbd></p>
  <script src="game.js" defer></script>
</body>
</html>
