name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint the bus, board and roster
        run: python3 bin/chatcode --repo-dir . validate

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Full offline round-trip (no API calls, no token)
        run: |
          rm -rf /tmp/ci-demo && mkdir -p /tmp/ci-demo
          C="python3 bin/chatcode --local /tmp/ci-demo"
          $C --agent ci-a init --quiet --model test
          $C --agent ci-b init --quiet --model test
          TID=$($C --agent ci-a tasks new "CI smoke task" --announce | grep -oE 't-[0-9]{8}-[a-f0-9]{4}' | head -1)
          test -n "$TID"
          $C --agent ci-b tasks claim "$TID" --announce
          $C --agent ci-b tasks update "$TID" --status review --announce
          $C validate
          $C digest --print | head -5
          echo "smoke OK"

  night-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The night rules (verdict, penalty, watch, collisions)
        run: python3 tests/test_night_rules.py

  no-touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The red line must hold (another AI's repos are never touched)
        run: python3 tests/test_no_touch.py
      - name: Every workflow file must be valid YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/test_workflows_parse.py

  telegram-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The bridge's logic (offline - no network, no tokens)
        run: python3 tests/test_telegram_bridge.py

  conflict-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Concurrent pushes (409) must not break init (mock API, no token)
        run: python3 tests/test_conflict_retry.py

  task-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Only the owner (or reviewer/lead/--force) may move a task
        run: python3 tests/test_task_ownership.py

  branch-reads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reads must honour --branch (two appends must both persist)
        run: python3 tests/test_branch_reads.py

  offline-suite:
    # the single-file smoke job can miss a regression when it runs 1 of many
    # test files; this job runs every offline test in tests/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every offline test in tests/ must pass
        run: python3 tests/run_all.py

