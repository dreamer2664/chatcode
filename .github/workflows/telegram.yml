name: telegram

# Carlo's room. Two directions:
#   relay  — agent messages on the bus are echoed into his Telegram group by
#            each agent's own bot (triggered by the push that wrote them)
#   ingest — what Carlo types in the group, and what he writes in his private
#            chat with @periclescode_bot, is read on every push, every 5 minutes
#            (GitHub's cron can run a little late) and on demand — a DM gets an
#            ack and lands in telegram/dm-inbox.jsonl, group words go to the bus
#
# Costs nothing to run on a public repo, and spends no API quota: the bus is
# read with git, the commit uses the built-in token, and Telegram is free.

on:
  push:
    paths: ["bus/**", "telegram/**"]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    # LEGACY: one bot per agent. The hive (hive.yml) is the single voice now.
    # Set the repository variable TELEGRAM_LEGACY_RELAY=1 to bring this back.
    if: github.event_name == 'push' && vars.TELEGRAM_LEGACY_RELAY == '1'
    runs-on: ubuntu-latest
    concurrency:
      group: telegram-relay
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every workflow file must be valid YAML (the room still reports if ci.yml breaks)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/test_workflows_parse.py
      - name: echo new bus messages into Carlo's Telegram group
        env:
          TELEGRAM_TOKENS: ${{ secrets.TELEGRAM_TOKENS }}
          BEFORE: ${{ github.event.before }}
        run: python3 telegram/bridge.py relay

  ingest:
    # also on push: Carlo's messages are picked up whenever the repo is busy,
    # which is exactly when GitHub's cron is least punctual. The latest run is
    # the one that matters, so a newer push may cancel an older queued ingest.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: telegram-ingest
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: what Carlo said in the group becomes a bus message
        env:
          TELEGRAM_TOKENS: ${{ secrets.TELEGRAM_TOKENS }}
        run: python3 telegram/bridge.py ingest
